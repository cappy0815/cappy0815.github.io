<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden</title>
  <script>
    // GitHub Pages unterscheidet Groß-/Kleinschreibung im Pfad.
    // Bekannte Projekte unabhängig von der Schreibweise weiterleiten.
    // Schlüssel klein geschrieben, Ziel exakt wie der Repo-Name.
    (function () {
      var PROJECTS = {
        'nev-daily': '/NEV-Daily/',
        'nevdaily': '/NEV-Daily/'
      };
      var parts = location.pathname.split('/').filter(Boolean);
      if (!parts.length) return;
      var target = PROJECTS[parts[0].toLowerCase()];
      if (!target) return;
      var rest = parts.slice(1).join('/');
      var url = target + rest + location.search + location.hash;
      if (url !== location.pathname + location.search + location.hash) location.replace(url);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0D10; color: #F4F6F7;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 16px; }
    a { color: #8FC9E8; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #A2ADB6; margin: 0; }
  </style>
</head>
<body>
  <div>
    <h1>Seite nicht gefunden</h1>
    <p>Zur <a href="/">Projektübersicht</a></p>
  </div>
</body>
</html>
