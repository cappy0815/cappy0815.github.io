name: Statistik

on:
  schedule:
    - cron: "23 3 * * *"    # täglich 03:23 UTC: Zahlen sichern
    - cron: "37 5 * * 1"    # montags 05:37 UTC (06:37 MEZ): sichern + Wochenmail
  workflow_dispatch:
    inputs:
      mail:
        description: "Wochenmail jetzt verschicken"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zahlen sammeln
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/stats_collect.py

      - name: Daten speichern
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/data/history.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Statistik $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Wochenmail
        if: github.event.schedule == '37 5 * * 1' || inputs.mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python .github/scripts/stats_report.py
